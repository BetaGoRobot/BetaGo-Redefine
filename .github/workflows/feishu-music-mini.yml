name: Feishu music mini

on:
  push:
    branches: [master, feat/feishu-background-audio-prototype]
    paths:
      - 'examples/feishu-music-mini/**'
      - '.github/workflows/feishu-music-mini.yml'
  pull_request:
    branches: [master]
    paths:
      - 'examples/feishu-music-mini/**'
      - '.github/workflows/feishu-music-mini.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/feishu-music-mini
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run fixtures:generate
      - run: npm run verify
      - run: npm run package
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: feishu-music-mini-packages
          path: |
            examples/feishu-music-mini/dist/*.zip
            examples/feishu-music-mini/dist/artifacts.json
            examples/feishu-music-mini/dist/build-report.json
          if-no-files-found: error
          retention-days: 14

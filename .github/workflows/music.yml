name: Music API
on:
  pull_request:
    paths: ['internal/music/**', 'cmd/music-server/**', 'script/sql/20261113_music.sql', '.github/workflows/music.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: music
          POSTGRES_PASSWORD: music-test-only
          POSTGRES_DB: music_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U music -d music_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Persistent API, isolation, CAS and provider tests
        env:
          BETAGO_CONFIG_PATH: .dev/config.toml
          TEST_MUSIC_DSN: host=127.0.0.1 port=5432 user=music password=music-test-only dbname=music_test sslmode=disable
        run: go test -tags=custom_skip_vips -v -race ./internal/music ./cmd/music-server
